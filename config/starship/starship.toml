"$schema" = 'https://starship.rs/config-schema.json'
# ~/.config/starship.toml

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

add_newline = true
command_timeout = 500
scan_timeout = 30

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration
$character"""

right_format = ""

[fill]
symbol = " "

# -----------------------------------------------------------------------------
# Prompt
# -----------------------------------------------------------------------------

[character]
success_symbol = "[❯](bold #f0f6fc)"
error_symbol = "[❯](bold #ff7b72)"
vimcmd_symbol = "[❮](bold #f0f6fc)"

# -----------------------------------------------------------------------------
# Directory
# -----------------------------------------------------------------------------

[directory]
style = "fg:#c9d1d9"
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
read_only = " 󰌾"

# -----------------------------------------------------------------------------
# Git
# -----------------------------------------------------------------------------

[git_branch]
symbol = ""
style = "bold fg:#f0f6fc"
format = " on [$branch]($style)"

[git_status]
style = "fg:#6e7681"
format = "[$all_status$ahead_behind]($style)"

conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# -----------------------------------------------------------------------------
# Duration
# -----------------------------------------------------------------------------

[cmd_duration]
min_time = 750
format = "[$duration](fg:#6e7681)"

# -----------------------------------------------------------------------------
# Languages
# -----------------------------------------------------------------------------

[golang]
format = " via [go $version](fg:#6e7681)"
detect_extensions = ["go"]

[nodejs]
format = " via [node $version](fg:#6e7681)"

[python]
format = " via [py $version](fg:#6e7681)"

[rust]
format = " via [rs $version](fg:#6e7681)"

# -----------------------------------------------------------------------------
# Disable modules
# -----------------------------------------------------------------------------

